[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aero-agent"
version = "0.1.0"
description = "AERO — a zero-dependency terminal coding agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "ronak-create"}]
keywords = ["terminal", "agent", "coding", "cli", "tui", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/ronak-create/aero"
Repository = "https://github.com/ronak-create/aero"
Issues = "https://github.com/ronak-create/aero/issues"

[project.scripts]
aero = "cli:main"

[tool.setuptools]
py-modules = ["cli", "agent", "config", "llm_client", "term", "theme", "markdown", "diff", "conftest", "run_tests"]
packages = ["tools", "plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
